name: CodeQL

# Static analysis of the Python code for security problems (GitHub code scanning). Results are under the
# repository's Security tab. Runs on every push and pull request, and weekly to pick up new CodeQL queries.
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
