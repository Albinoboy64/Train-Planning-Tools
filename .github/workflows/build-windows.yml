name: Build portable Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v1.01). Leave blank to just build."
        required: false
        default: ""
      sha:
        description: "Build this commit (set by promote: the commit it merged into main). Leave blank for the branch's latest."
        required: false
        default: ""

permissions:
  contents: read             # jobs that publish or merge ask for more themselves (build, promote)

jobs:
  # Checks first, as separate jobs (each shows on its own): lint, type-check, tests with coverage and the dependency
  # audit. The exe is built, smoke-tested and released only when all four pass.
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || '' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
      - name: Install the pinned linter
        run: python -m pip install "$(grep -i '^ruff==' packaging/build-requirements.txt)"
      - name: Lint
        run: ruff check .

  typecheck:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || '' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
      - name: Install the pinned packages (not the exe builder)
        run: |
          grep -v -i -E '^(pyinstaller|pyinstaller-hooks-contrib|altgraph|pefile|pywin32-ctypes)==' \
            packaging/build-requirements.txt > "$RUNNER_TEMP/req.txt"
          python -m pip install pip==26.3
          pip install --no-deps -r "$RUNNER_TEMP/req.txt"
      - name: Type-check
        run: mypy

  test:
    timeout-minutes: 40
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || '' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
      - name: Show the Python and Tcl/Tk versions
        run: python -c "import sys, tkinter; print('Python', sys.version); print('Tcl/Tk', tkinter.Tcl().eval('info patchlevel'))"
      - name: Install the pinned packages
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install pip==26.3
          pip install --no-deps -r packaging/build-requirements.txt
          pip check
      - name: Run tests with coverage (fails under the floor in pyproject.toml)
        run: python -m pytest -q tests --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  audit:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || '' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
      - name: Install pip-audit (its own pins, apart from the app's)
        run: python -m pip install -r packaging/audit-requirements.txt
      - name: Audit the pinned packages for known vulnerabilities
        run: pip-audit --strict --disable-pip --no-deps -r packaging/build-requirements.txt

  build:
    needs: [lint, typecheck, test, audit]
    timeout-minutes: 90
    runs-on: windows-latest
    # Builds of main run one after another (a waiting older build is replaced by the newest), so two releases of
    # one version can never publish at the same time: the newest build always publishes last.
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'release-main' || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write            # the release
      id-token: write            # build provenance attestation
      attestations: write
    env:
      # Code signing (optional). Add these repository secrets to sign the exe automatically:
      #   SIGNING_CERT_PFX_BASE64  - the code-signing certificate (.pfx) encoded as base64
      #   SIGNING_CERT_PASSWORD    - the .pfx password
      HAS_SIGNING_CERT: ${{ secrets.SIGNING_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha || '' }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"

      - name: Install the pinned build packages
        # Exact versions from packaging/build-requirements.txt (nothing unpinned: --no-deps, then pip check).
        # PyInstaller is compiled from source with its own bootloader: one not shared with other PyInstaller
        # apps, which greatly reduces false antivirus / Defender warnings.
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true     # stop at the first command that fails
          python -m pip install pip==26.3
          pip install --no-deps --no-binary pyinstaller -r packaging/build-requirements.txt
          pip check

      - name: Build TrainPlanningTools.exe (single portable file)
        run: |
          python packaging/make_version_file.py version_info.txt
          pyinstaller --noconfirm packaging/TrainPlanningTools.spec
          "TrainPlanningTools.exe size: {0:N1} MB" -f ((Get-Item dist\TrainPlanningTools.exe).Length / 1MB)

      - name: Sign TrainPlanningTools.exe (only if a signing certificate secret is set)
        if: env.HAS_SIGNING_CERT == 'true'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SIGNING_CERT_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_B64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f $pfx /p $env:PFX_PASSWORD `
            /tr http://timestamp.digicert.com /td SHA256 /d "Train Planning Tools" dist\TrainPlanningTools.exe
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }
          & $signtool.FullName verify /pa dist\TrainPlanningTools.exe
          Remove-Item $pfx

      - name: Smoke test the exe (command-line mode)
        shell: pwsh
        run: |
          # every run of the exe: at most 5 minutes (a crash in a windowed exe can wait on a dialog for ever), and a
          # non-zero exit code fails the step (-MayFail: the caller checks the exit code itself)
          function Run-Exe([string[]]$argList, [switch]$MayFail) {
            $p = Start-Process -FilePath dist\TrainPlanningTools.exe -ArgumentList $argList -PassThru
            $null = $p.Handle                    # keeps the exit code readable once it has ended
            if (!$p.WaitForExit(300000)) { $p.Kill(); throw "exe timed out after 5 minutes: $($argList -join ' ')" }
            $p.WaitForExit()
            if (!$MayFail -and $p.ExitCode -ne 0) { throw "exe exited with $($p.ExitCode): $($argList -join ' ')" }
            return $p
          }
          python -c "import sys; sys.path.insert(0,'tests'); import test_compare as t, os; d=os.path.abspath('smoke'); os.makedirs(d, exist_ok=True); t.make(os.path.join(d,'a.xlsx'), t.BTN_ORIG, t.VIC_ORIG); b,v=t._upd_rows(); t.make(os.path.join(d,'b.xlsx'), b, v)"
          $p = Run-Exe @('--original','smoke\a.xlsx','--updated','smoke\b.xlsx','--out','smoke','--name','smoke')
          if (!(Test-Path smoke\smoke.xlsx)) { throw "exe did not produce output" }
          python -c "import sys; sys.path.insert(0,'tests'); import test_statspack as t; t.write_xml('smoke/sp.xml'); t.write_docx('smoke/sp.docx', t.plan_lines())"
          $p = Run-Exe @('statspack','--xml','smoke\sp.xml','--trent','smoke\sp.docx','--days','MO,TO','--out','smoke','--name','sp')
          if (!(Test-Path smoke\sp.xlsx)) { throw "exe did not produce a stats pack" }
          $p = Run-Exe @('statspack','--xml','smoke\sp.xml','--trent','smoke\sp.docx','--days','MO,TO','--out','smoke','--name','sp','--format','pdf')
          if (!(Test-Path smoke\sp.pdf)) { throw "exe did not produce a PDF stats pack" }
          $p = Run-Exe @('statspack','--xml','smoke\sp.xml','--trent','smoke\sp.docx','--days','MO,TO','--out','smoke','--name','units','--unit-reports','washes,cets,depots,captive,fuel','--unit-period','days','--format','docx')
          if (!(Test-Path smoke\units.docx)) { throw "exe did not produce a Word unit report" }
          $p = Run-Exe @('statspack','--xml','smoke\sp.xml','--trent','smoke\sp.docx','--days','MO,TO','--out','smoke','--name','seats','--capacity-corridor','"Brighton Main Line (East Croydon - Brighton)"','--corridor-direction','reverse','--between','06:00-09:00','--at','"East Croydon"','--direction','both')
          if (!(Test-Path smoke\seats.xlsx)) { throw "exe did not produce a capacity report" }
          $p = Run-Exe @('statspack','--xml','smoke\sp.xml','--trent','smoke\sp.docx','--old-xml','smoke\sp.xml','--old-trent','smoke\sp.docx','--days','MO,TO','--out','smoke','--name','units_cmp','--unit-reports','washes,depots')
          if (!(Test-Path smoke\units_cmp.xlsx)) { throw "exe did not produce a unit report comparison" }
          $p = Run-Exe @('statspack','--xml','smoke\sp.xml','--trent','smoke\sp.docx','--days','MO,TO','--out','smoke','--name','units_week','--unit-reports','washes,cets,fuel','--possible','over')
          if ($p.ExitCode -ne 0 -or !(Test-Path smoke\units_week.xlsx)) { throw "exe did not produce a whole-week unit report with the possible-slot option" }
          python -c "import sys; sys.path.insert(0,'tests'); import test_stationbook as t; t.write_xml('smoke/swb.xml')"
          $p = Run-Exe @('stationbook','--xml','smoke\swb.xml','--station','Alpha','--out','smoke','--name','swb')
          if (!(Test-Path smoke\swb.xlsx)) { throw "exe did not produce a station working book" }
          python -c "import sys, os; sys.path.insert(0,'tests'); import test_timetable as t; t._books(os.path.abspath('smoke'))"
          $p = Run-Exe @('timetable','--gtr','smoke\gtr.xlsx','--nr','smoke\nr.xlsx','--out','smoke')
          if (!(Test-Path "smoke\K_D26 Consolidated TT Comparison.xlsx")) { throw "exe did not produce a timetable comparison" }
          python -c "from rstools.docexport import Section as S, write_pdf, write_docx; h=['Location','Arr','Dep']; write_pdf('smoke/p1.pdf', 'P', [S('Train 1A00  UID C12340  SX', h, [['Brighton','','0500'],['London Bridge','0553','']])]); write_docx('smoke/p2.docx', 'P', [S('Train 1A00  UID C12340  SX', h, [['Brighton','','0502'],['London Bridge','0555','']])])"
          $p = Run-Exe @('timetable','--prints','smoke\p1.pdf','--vs','smoke\p2.docx','--out','smoke','--name','prints')
          if (!(Test-Path smoke\prints.xlsx)) { throw "exe did not produce a train print comparison" }
          python -c "import sys; sys.path.insert(0,'tests'); import test_timetable as t; t.write_attune_pdf('smoke/attune.pdf'); t._gtr_from(t.ATTUNE[:1], 'smoke/tt_check.xlsx')"
          $p = Run-Exe @('timetable','--base-prints','smoke\attune.pdf','--check','smoke\tt_check.xlsx','--out','smoke','--name','print_tt')
          if (!(Test-Path smoke\print_tt.xlsx)) { throw "exe did not produce a print-against-timetable comparison" }
          $p = Run-Exe @('timetable','--prints','smoke\p1.pdf','--vs','smoke\p2.docx','--passenger-only','--out','smoke','--name','prints_pax')
          if (!(Test-Path smoke\prints_pax.xlsx)) { throw "exe did not produce a passenger-times-only print comparison" }
          python -c "import sys; sys.path.insert(0,'tests'); import test_timetable as t; t.write_vpt('smoke/v1.vpt',[t.vpt_1h05()]); t.write_vpt('smoke/v2.vpt',[t.vpt_1h05(HYWRDSH_plat='5')])"
          $p = Run-Exe @('timetable','--prints','smoke\v1.vpt','--vs','smoke\v2.vpt','--out','smoke','--name','vpt_cmp')
          if (!(Test-Path smoke\vpt_cmp.xlsx)) { throw "exe did not compare two VPT exports" }
          python -c "import sys, os; sys.path.insert(0,'tests'); import test_timetable as t; t.write_rule_docs(os.path.abspath('smoke')); t.write_s4_xml('smoke/s4plan.xml')"
          $p = Run-Exe @('timetable','--s4','smoke\s4_old.pdf','--vs-s4','smoke\s4_new.pdf','--highlight-pdfs','--out','smoke','--name','s4cmp')
          if (!(Test-Path smoke\s4cmp.xlsx)) { throw "exe did not compare two sets of Section 4 documents" }
          if (!(Test-Path 'smoke\s4_new - highlighted.pdf')) { throw "exe did not save the highlighted Section 4 PDFs" }
          $p = Run-Exe @('timetable','--tpr','smoke\tpr_old.pdf','--vs-tpr','smoke\tpr_new.pdf','--out','smoke','--name','tprcmp')
          if (!(Test-Path smoke\tprcmp.xlsx)) { throw "exe did not compare two sets of TPR documents" }
          $p = Run-Exe @('timetable','--s4-check','smoke\s4plan.xml','--s4','smoke\s4_old.pdf','--out','smoke','--name','s4check')
          if (!(Test-Path smoke\s4check.xlsx)) { throw "exe did not run the Section 4 check" }
          $p = Run-Exe @('timetable','--s4-check','smoke\s4plan.xml','--s4','smoke\s4_old.pdf','--vpt','smoke\v1.vpt','--other-vpt','smoke\v2.vpt','--out','smoke','--name','s4check_vpt')
          if (!(Test-Path smoke\s4check_vpt.xlsx)) { throw "exe did not run the Section 4 check with VPTs" }
          $p = Run-Exe @('section4','--xml','smoke\s4plan.xml','--pdf','smoke\s4_old.pdf','--vpt','smoke\v1.vpt','--out','smoke','--name','s4sub')
          if (!(Test-Path smoke\s4sub.xlsx)) { throw "exe did not run the section4 subcommand" }
          python -c "import sys; sys.path.insert(0,'tests'); import test_stationbook as t; t.write_late_xml('smoke/late.xml'); t.write_late_xml('smoke/other.xml', operator='XC')"
          $p = Run-Exe @('stationbook','--xml','smoke\late.xml','--station','Alpha','--merge-xml','smoke\other.xml','--out','smoke','--name','swb_merged')
          if (!(Test-Path smoke\swb_merged.xlsx)) { throw "exe did not make a station book with another operator merged in" }
          $p = Run-Exe @('stationbook','--xml','smoke\swb.xml','--station','Alpha','--book-operator','SNGX','--merge','smoke\attune.pdf','--other-operators','SN','--out','smoke','--name','swb_sngx')
          if ($p.ExitCode -ne 0 -or !(Test-Path smoke\swb_sngx.xlsx)) { throw "exe did not make an SNGX station book with an F3 print merged in" }
          $p = Run-Exe @('timetable','--s4-check','smoke\s4plan.xml','--s4','smoke\s4_old.pdf','--other','smoke\attune.pdf','--out','smoke','--name','s4check_f3')
          if ($p.ExitCode -ne 0 -or !(Test-Path smoke\s4check_f3.xlsx)) { throw "exe did not run the Section 4 check with an F3 print for another operator" }
          $p = Run-Exe @('selftest','smoke\attune.pdf')
          if ($p.ExitCode -ne 0) { throw "the exe could not read an Attune print with PDFium, find its built-in Section 4 rules or berthing layout, or open a window with drag and drop" }
          python -c "import sys, os; sys.path.insert(0,'tests'); import test_compare as t; [os.makedirs(f'smoke/{d}', exist_ok=True) for d in ('bo', 'bu', 'bout')]; b, v = t._upd_rows(); [t.make(f'smoke/bo/{n} Proof 1.xlsx', t.BTN_ORIG, t.VIC_ORIG) or t.make(f'smoke/bu/{n} Proof 2.xlsx', b, v) for n in ('BTN', 'VIC')]"
          $p = Run-Exe @('--original-folder','smoke\bo','--updated','smoke\bu','--out','smoke\bout')
          if ((Get-ChildItem smoke\bout -Filter *Proof*.xlsx | Where-Object { $_.Name -notlike '*Change Report*' }).Count -ne 2) { throw "exe batch comparison did not produce two CWNs" }
          python -c "import sys; sys.path.insert(0,'tests'); import test_compare as t; t.make_multi_day('smoke/multi.xlsx')"
          $p = Run-Exe @('reorder','smoke\multi.xlsx','--out','smoke','--name','reordered')
          if (!(Test-Path smoke\reordered.xlsx)) { throw "exe did not put day variants in order" }
          python -c "import sys; sys.path.insert(0,'tests'); import test_berthing as t; tr, dg = t.base_plan(); open('smoke/berth.xml', 'w').write(t.xml(tr, dg)); t.make_chart('smoke/berth_layout.xlsx')"
          $p = Run-Exe @('berthing','--xml','smoke\berth.xml','--layout','smoke\berth_layout.xlsx','--issue','Smoke','--out','smoke','--name','berth')
          if (!(Test-Path smoke\berth.xlsx)) { throw "exe did not make a berthing chart" }
          $p = Run-Exe @('berthing','--xml','smoke\berth.xml','--counts','--issue','Smoke','--out','smoke','--name','berth_default')
          if (!(Test-Path smoke\berth_default.xlsx)) { throw "exe did not make a berthing chart in its built-in layout" }
          $p = Run-Exe @('berthing','--xml','smoke\berth.xml','--no-notes','--out','smoke','--name','berth_nonotes')
          if ($p.ExitCode -ne 0 -or !(Test-Path smoke\berth_nonotes.xlsx)) { throw "exe did not make a berthing chart without notes" }
          $p = Run-Exe @('berthing','--compare','smoke\berth_layout.xlsx','smoke\berth.xlsx','--out','smoke','--name','berth_cmp')
          if (!(Test-Path "smoke\berth_cmp - Change Report.xlsx")) { throw "exe did not compare two berthing charts" }
          $p = Run-Exe @('berthing','--blank','--leave-out','Barnham','--issue','Smoke','--out','smoke','--name','berth_blank')
          if ($p.ExitCode -ne 0 -or !(Test-Path smoke\berth_blank.xlsx)) { throw "exe did not make a blank SNGX berthing chart" }
          $p = Run-Exe @('berthing','--blank','--operator','TLGN','--add','Brighton','--timetable','"May 2027"','--out','smoke','--name','berth_blank_tlgn')
          if ($p.ExitCode -ne 0 -or !(Test-Path smoke\berth_blank_tlgn.xlsx)) { throw "exe did not make a blank TLGN berthing chart" }
          python -c "import sys; sys.path.insert(0,'tests'); import workings_fixture as w; w.make_smoke('smoke')"
          $p = Run-Exe @('workings-berthing','--workings','smoke\wk_a.xlsx','--out','smoke','--name','wk_berth')
          if ($p.ExitCode -ne 0 -or !(Test-Path smoke\wk_berth.xlsx)) { throw "exe did not add berthing arrangements to platform workings" }
          $p = Run-Exe @('--original','smoke\wk_a.xlsx','--updated','smoke\wk_b.xlsx','--out','smoke','--name','wk_cmp')
          if (!(Test-Path "smoke\wk_cmp - Change Report.xlsx")) { throw "exe did not compare two platform workings" }
          # more modes (3.36): each must exit cleanly and save its output
          function Smoke($argList, $out, $what) {
            if (Test-Path $out) { Remove-Item $out }
            $p = Run-Exe $argList -MayFail
            if ($p.ExitCode -ne 0 -or !(Test-Path $out)) { throw "exe did not $what (exit $($p.ExitCode))" }
          }
          python -c "open('smoke/l1.csv','w').write('Headcode,UID,Days,Origin,Origin Dep,Destination,Class\n1A00,C10000,SX,Brighton,0600,Bedford,377\n1A01,C10001,SX,Brighton,0610,Bedford,377\n'); open('smoke/l2.csv','w',encoding='cp1252').write('Headcode,UID,Days,Origin,Origin Dep,Destination,Class\n1A00,C10000,SX,Brighton,0603,Bedford \u00a3,377\n')"
          Smoke @('timetable','--lists','smoke\l1.csv','--vs','smoke\l2.csv','--out','smoke','--name','lists') 'smoke\lists.xlsx' 'compare two train lists'
          Smoke @('timetable','--base-list','smoke\l1.csv','--check','smoke\tt_check.xlsx','--out','smoke','--name','base_list') 'smoke\base_list.xlsx' 'check a timetable against a train list'
          Smoke @('--previous','smoke\smoke.xlsx','--updated','smoke\b.xlsx','--out','smoke','--name','cumulative') 'smoke\cumulative.xlsx' 'add a round to a comparison CWN'
          Smoke @('statspack','--xml','smoke\sp.xml','--trent','smoke\sp.docx','--days','MO','--out','smoke','--name','sp_mo') 'smoke\sp_mo.xlsx' 'make a one-day stats pack'
          Smoke @('reorder','smoke\multi.xlsx','--by-time','--out','smoke','--name','reordered_time') 'smoke\reordered_time.xlsx' 'put day variants in time order'
          Smoke @('--original','smoke\a.xlsx','--updated','smoke\b.xlsx','--days','MO,FO','--report-format','pdf','--out','smoke','--name','cmp_pdf') 'smoke\cmp_pdf - Change Report.pdf' 'compare chosen days with a PDF change report'
          Smoke @('statspack','--old-pack','smoke\sp.xlsx','--new-pack','smoke\sp_mo.xlsx','--out','smoke','--name','packs') 'smoke\packs.xlsx' 'compare two stats packs'
          Smoke @('statspack','--xml','smoke\sp.xml','--trent','smoke\sp.docx','--mileage-period','timetable','--out','smoke','--name','sp_tt') 'smoke\sp_tt.xlsx' 'make the mileage for the whole timetable'
          Smoke @('statspack','--xml','smoke\sp.xml','--trent','smoke\sp.docx','--mileage-period','month','--month','2027-01','--out','smoke','--name','sp_month') 'smoke\sp_month.xlsx' 'make the mileage for one month'
          Smoke @('statspack','--xml','smoke\sp.xml','--trent','smoke\sp.docx','--mileage-period','custom','--period-from','14/12/2026','--period-to','20/12/2026','--out','smoke','--name','sp_custom') 'smoke\sp_custom.xlsx' 'make the mileage for a custom period'
          Smoke @('statspack','--xml','smoke\sp.xml','--trent','smoke\sp.docx','--days','MO,TO','--out','smoke','--name','cap_group','--capacity-group','1A') 'smoke\cap_group.xlsx' 'make a service group capacity report'
          Smoke @('statspack','--xml','smoke\sp.xml','--trent','smoke\sp.docx','--days','MO,TO','--out','smoke','--name','cap_ft','--capacity-from','Brighton','--capacity-to','"East Croydon"') 'smoke\cap_ft.xlsx' 'make a from-to capacity report'
          Smoke @('berthing','--chart','smoke\berth.xlsx','--original','smoke\berth.xml','--updated','smoke\berth.xml','--out','smoke','--name','berth_round') 'smoke\berth_round.xlsx' 'add a round to a berthing chart'
          Smoke @('workings-berthing','--workings','smoke\wk_a.xlsx','--xml','smoke\berth.xml','--out','smoke','--name','wk_xml') 'smoke\wk_xml.xlsx' 'add berthing arrangements with siding roads from an XML'
          python -c "import sys; sys.path.insert(0,'tests'); import test_berthing as t; open('smoke/tlgn.xml', 'w').write(t.tlgn_xml())"
          Smoke @('berthing','--xml','smoke\tlgn.xml','--operator','TLGN','--issue','Final','--out','smoke','--name','berth_tlgn') 'smoke\berth_tlgn.xlsx' 'make a TLGN berthing chart'
          Smoke @('berthing','--xml','smoke\tlgn.xml','--leave-out','"Hove Yard"','--add','Bedford','--out','smoke','--name','berth_places') 'smoke\berth_places.xlsx' 'make a berthing chart with locations left out and added'
          python -c "import sys; sys.path.insert(0,'tests'); import others_fixture as f; f.southeastern_cif('smoke/se.cif')"
          Smoke @('other-trains','--file','smoke\wk_a.xlsx','--others','smoke\se.cif','--out','smoke','--name','wk_others') 'smoke\wk_others.xlsx' 'add other operators trains to platform workings'
          Smoke @('workings-berthing','--workings','smoke\wk_a.xlsx','--others','smoke\se.cif','--out','smoke','--name','wk_berth_others') 'smoke\wk_berth_others.xlsx' 'add berthing arrangements with other operators'
          Smoke @('berthing','--xml','smoke\berth.xml','--others','smoke\se.cif','--out','smoke','--name','berth_others') 'smoke\berth_others.xlsx' 'make a berthing chart with other operators'
          # more modes (3.38.6): plan comparison, merged variants, blank chart from an XML, built-in Section 4
          # rules, PDF / Word outputs, and several station books at once (the helper processes of the frozen exe)
          Smoke @('statspack','--xml','smoke\sp.xml','--trent','smoke\sp.docx','--old-xml','smoke\sp.xml','--old-trent','smoke\sp.docx','--days','MO,TO','--out','smoke','--name','sp_cmp') 'smoke\sp_cmp.xlsx' 'compare two plans'
          Smoke @('reorder','smoke\multi.xlsx','--merge','--out','smoke','--name','reordered_merged') 'smoke\reordered_merged.xlsx' 'merge day variants'
          Smoke @('berthing','--blank','--xml','smoke\berth.xml','--out','smoke','--name','berth_blank_xml') 'smoke\berth_blank_xml.xlsx' 'make a blank berthing chart from an XML'
          Smoke @('section4','--xml','smoke\s4plan.xml','--out','smoke','--name','s4builtin') 'smoke\s4builtin.xlsx' 'run the Section 4 check with its built-in rules'
          Smoke @('section4','--xml','smoke\s4plan.xml','--pdf','smoke\s4_old.pdf','--format','pdf','--out','smoke','--name','s4pdf') 'smoke\s4pdf.pdf' 'save the Section 4 check as a PDF'
          Smoke @('timetable','--s4','smoke\s4_old.pdf','--vs-s4','smoke\s4_new.pdf','--format','docx','--out','smoke','--name','s4cmp_docx') 'smoke\s4cmp_docx.docx' 'save a Section 4 comparison as Word'
          New-Item -ItemType Directory -Force -Path smoke\books | Out-Null
          $p = Run-Exe @('stationbook','--xml','smoke\swb.xml','--station','"Alpha; Beta; Gamma; Alpha [1-2]"','--out','smoke\books')
          if ((Get-ChildItem smoke\books -Filter *.xlsx).Count -ne 4) { throw "exe did not make four station books at once" }
          $p = Run-Exe @('--original','smoke\a.xlsx','--updated','smoke\b.xlsx','--acwn','--highlight-only') -MayFail
          if ($p.ExitCode -eq 0) { throw "exe accepted --acwn with --highlight-only" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist\TrainPlanningTools.exe package\
          Copy-Item README.md package\README.md
          Copy-Item LICENSE package\LICENSE.txt
          Compress-Archive -Path package\* -DestinationPath TrainPlanningTools-portable.zip -Force

      - name: SBOM (CycloneDX) and checksums
        # the SBOM lists the app, Python and the pinned runtime packages; check_sbom fails the build if any pin is
        # missing or at another version. SHA256SUMS.txt covers everything attached to the release.
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python packaging/make_sbom.py TrainPlanningTools.cdx.json
          python packaging/check_sbom.py TrainPlanningTools.cdx.json
          $files = 'dist\TrainPlanningTools.exe', 'TrainPlanningTools-portable.zip', 'TrainPlanningTools.cdx.json'
          $lines = foreach ($f in $files) { "{0}  {1}" -f (Get-FileHash $f -Algorithm SHA256).Hash.ToLower(), (Split-Path $f -Leaf) }
          Set-Content -Path SHA256SUMS.txt -Value $lines -Encoding ascii
          Get-Content SHA256SUMS.txt

      - name: Build provenance attestation (where the repository's plan supports it)
        # Attestations need a public repository or a plan that includes them; elsewhere this step is skipped with
        # a warning and the build carries on.
        continue-on-error: true
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/TrainPlanningTools.exe
            TrainPlanningTools-portable.zip
            TrainPlanningTools.cdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: TrainPlanningTools-portable
          path: |
            dist/TrainPlanningTools.exe
            TrainPlanningTools-portable.zip
            TrainPlanningTools.cdx.json
            SHA256SUMS.txt

      - name: Work out the release tag (version tag, manual release tag, or a new version on main)
        id: rel
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            version=$(python -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('cwn_compare/__init__.py').read()).group(1))")
            if [[ "$INPUT_TAG" != "v$version" ]]; then
              echo "::error::Release tag $INPUT_TAG does not match the version being built ($version)."
              exit 1
            fi
            if [[ -n "$(git ls-remote --tags origin "refs/tags/$INPUT_TAG")" ]]; then
              echo "::error::$INPUT_TAG is already released; bump __version__ for a new release."
              exit 1
            fi
            tag="$INPUT_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            # a push to main releases its version once: skipped when that version's tag already exists
            version=$(python -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('cwn_compare/__init__.py').read()).group(1))")
            if [[ -n "$version" && -z "$(git ls-remote --tags origin "refs/tags/v$version")" ]]; then
              tag="v$version"
            else
              echo "v$version is already released; this push only builds."
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag:-none (build only)}"

      - name: Release notes (this version's entry in the README version history)
        if: steps.rel.outputs.tag != ''
        shell: python
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          import os, re
          text = open("README.md", encoding="utf-8").read()
          version = os.environ["TAG"].lstrip("vV")
          m = re.search(r"^\*\*" + re.escape(version) + r"\*\*[^\n]*\n(.*?)(?=^\*\*\d|^## )", text, re.S | re.M)
          changes = m.group(1).strip() if m else "See the README for the version history."
          intro = ("Portable Windows app for GTR train planning: Stock Tools (compare Carriage Working Notices and "
                   "platform workings, put day variants in order, make TRACS-RS style station working books and "
                   "berthing charts, and add other operators' trains), Stats Pack (rolling stock stats packs, unit "
                   "and capacity reports from an Attune XML and the TRENT unit diagram print), Timing Tools (GTR "
                   "against Network Rail timetables, train prints and Attune train lists, and the Section 4 "
                   "possession check) and a Live View to browse any comparison train by train. No installation or "
                   "admin rights needed.\n\nDownload **TrainPlanningTools.exe** (or the zip, which also "
                   "contains the README) and double-click it. Already have 3.11.1 or later? Use Help > Check "
                   "for updates. Copies of 3.11.0 or earlier cannot update themselves to this repository: "
                   "download the exe once by hand and replace the old one (settings are kept).")
          import hashlib
          digest = hashlib.sha256(open("dist/TrainPlanningTools.exe", "rb").read()).hexdigest().upper()
          ident = (f"\n\n**For IT allow-listing:** TrainPlanningTools.exe SHA-256 `{digest}` (publisher "
                   "'GTR Train Planning' in Properties > Details). Checksums of every file are in SHA256SUMS.txt, "
                   "and TrainPlanningTools.cdx.json is the software bill of materials (CycloneDX).")
          open("release_notes.md", "w", encoding="utf-8").write(
              f"{intro}{ident}\n\n## What's new in {version}\n\n{changes}\n")

      - name: Publish release (version tags, a manual run with a release tag, or a new version on main)
        if: steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: Train Planning Tools ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ inputs.sha || github.sha }}
          body_path: release_notes.md
          files: |
            dist/TrainPlanningTools.exe
            TrainPlanningTools-portable.zip
            TrainPlanningTools.cdx.json
            SHA256SUMS.txt

  # Automatic merge into main and release. After a green build (lint, type-check, tests, exe, smoke tests) of any
  # branch other than main, pushed from any account, the branch is merged into main and the new version is built and
  # released as the portable app. Dependabot's branches are built and tested but left for review (its runs have no
  # write access).
  #   * When main has moved on since the branch was made (another branch was merged first), the merge result itself is
  #     linted, type-checked and tested before it is pushed, so main only ever gets code that passed. A branch that
  #     would take __version__ backwards (one made from an old main) is refused.
  #   * If main moves while this runs (a push by hand), the merge and checks are done again once on the new main.
  #   * With no setup, GitHub's own token does the merge. GitHub does not let that token change files in
  #     .github/workflows, and a push it makes does not start the build on main, so main is built and released by
  #     starting the workflow on main directly (below). A branch that edits a workflow is then merged by a pull request.
  #   * To remove both limits, add a repository secret AUTO_MERGE_TOKEN (a fine-grained personal access token for this
  #     repository with Contents and Workflows read and write). Its push to main then starts the normal build and
  #     release by itself.
  # The release is made once per version: bump cwn_compare/__init__.py __version__ for a new release.
  promote:
    needs: build
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
      && github.actor != 'dependabot[bot]' && !startsWith(github.ref, 'refs/heads/dependabot/')
    timeout-minutes: 60
    runs-on: windows-latest        # the same system as the tests, so the merge result is checked like the branch
    permissions:
      contents: write
      actions: write
    concurrency:
      group: promote-to-main
      cancel-in-progress: false
    env:
      AUTO_MERGE_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTO_MERGE_TOKEN || github.token }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"

      - name: Merge the tested commit into main (checking the merge result when main has moved on)
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tested="$GITHUB_SHA"
          version_of() { git show "$1:cwn_compare/__init__.py" | python -c "import re, sys; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', sys.stdin.read()).group(1))"; }
          installed=""
          check_merge() {
            if [[ -z "$installed" ]]; then
              python -m pip install pip==26.3
              pip install --no-deps -r packaging/build-requirements.txt
              pip check
              installed=1
            fi
            ruff check . && mypy && python -m pytest -q tests
          }
          for attempt in 1 2; do
            git fetch origin main
            main_sha=$(git rev-parse origin/main)
            if git merge-base --is-ancestor "$tested" "$main_sha"; then
              target="$main_sha"; merged=false                 # main already has this commit
            elif git merge-base --is-ancestor "$main_sha" "$tested"; then
              target="$tested"; merged=false                   # main is behind the branch: a fast-forward
            else
              git checkout -q --detach "$main_sha"
              if ! git merge --no-ff -m "Merge $GITHUB_REF_NAME into main (build passed)" "$tested"; then
                git merge --abort || true
                echo "::error::$GITHUB_REF_NAME and main changed the same lines, so it cannot be merged automatically. Merge main into the branch (resolve the conflict), push, and this runs again."
                exit 1
              fi
              target=$(git rev-parse HEAD); merged=true
            fi
            old=$(version_of "$main_sha"); new=$(version_of "$target")
            if ! python -c "import sys; v=lambda s: tuple(int(x) for x in s.split('.')); sys.exit(0 if v(sys.argv[2]) >= v(sys.argv[1]) else 1)" "$old" "$new"; then
              echo "::error::Merging $GITHUB_REF_NAME would take the version from $old back to $new (the branch was made from an older main). Merge main into the branch, bump __version__, push, and this runs again."
              exit 1
            fi
            if [[ "$merged" == true ]] && ! check_merge; then
              echo "::error::main has changed since $GITHUB_REF_NAME was made, and the two merged together fail the checks above. Merge main into the branch, fix what fails, push, and this runs again. main is unchanged."
              exit 1
            fi
            if [[ "$target" == "$main_sha" ]]; then
              echo "main already has this commit; nothing to merge."
              break
            fi
            if git push origin "$target:refs/heads/main"; then
              break
            fi
            git fetch origin main
            if [[ "$attempt" == 1 && "$(git rev-parse origin/main)" != "$main_sha" ]]; then
              echo "main moved while this ran: merging and checking again on the new main."
              continue
            fi
            echo "::error::GitHub refused the push to main. If the message above mentions workflow files, this change edits .github/workflows: merge this branch into main once by hand (a pull request), or add the AUTO_MERGE_TOKEN secret (see the notes on this job). If it mentions protected branch or required checks, allow this push in Settings > Rules / Branches."
            exit 1
          done
          version=$(version_of "$target")
          tag=""
          if [[ -n "$version" && -z "$(git ls-remote --tags origin "refs/tags/v$version")" ]]; then
            tag="v$version"
          else
            echo "v$version is already released: main is updated and built but no new release is made (bump __version__ for one)."
          fi
          moved=$([[ "$target" == "$main_sha" ]] && echo false || echo true)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "moved=$moved" >> "$GITHUB_OUTPUT"
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "Merged into main; release tag: ${tag:-none}"

      - name: Build (and release) main (started directly, as a push by GitHub's own token does not start it)
        # the exact commit merged is built and released, even if main moves on before the run starts
        if: (steps.merge.outputs.tag != '' || steps.merge.outputs.moved == 'true') && env.AUTO_MERGE_TOKEN == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.merge.outputs.tag }}
          SHA: ${{ steps.merge.outputs.sha }}
        run: gh workflow run build-windows.yml --ref main -f release_tag="$TAG" -f sha="$SHA"
