name: Bug report
description: Report a reproducible problem using synthetic data.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: >-
        Do not attach real CWNs, timetables, XML exports, train prints, or other sensitive operational data.
        Reproduce with synthetic data. For security issues, follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 3.27.7
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version and whether you used the portable executable or ran from source.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide minimal steps with synthetic data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error message or log
      description: Remove any sensitive information before pasting.
