name: Feature request
description: Suggest an improvement to Train Planning Tools.
title: "Feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What task or difficulty would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested solution
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: data
    attributes:
      label: Data safety
      options:
        - label: This request does not include real train plans, CWNs, timetable data, or other sensitive operational information.
          required: true
